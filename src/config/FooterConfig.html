  <div class="nitrene-footer-runtime">
    <span>Running for</span>
    <strong id="nitrene-site-uptime">0 days 0 hours 0 minutes 0 seconds</strong>
    <span>since 2026-06-30 </span>
  </div>
</div>

<script>
  (() => {
    const start = new Date("2026-06-30T14:31:14+08:00").getTime();
    const target = document.getElementById("nitrene-site-uptime");
    if (!target) return;

    const updateRuntime = () => {
      const elapsedMs = Math.max(0, Date.now() - start);
      const totalSeconds = Math.floor(elapsedMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      target.textContent =
        days +
        " days " +
        hours +
        " hours " +
        minutes +
        " minutes " +
        seconds +
        " seconds";
    };

    updateRuntime();
    window.setInterval(updateRuntime, 1000);
  })();
</script>
